# Debconf preseeds for the ProstOS build (applied before package installation).

# Do not let grub-pc try to install a bootloader into the build container.
grub-pc grub-pc/install_devices_empty boolean true

# Locale
locales locales/locales_to_be_generated multiselect ru_RU.UTF-8 UTF-8, en_US.UTF-8 UTF-8
locales locales/default_environment_locale select ru_RU.UTF-8

# Keyboard: Russian + English, switch with Alt+Shift
keyboard-configuration keyboard-configuration/layoutcode string ru
keyboard-configuration keyboard-configuration/modelcode string pc105
keyboard-configuration keyboard-configuration/variantcode string
console-setup console-setup/charmap47 select UTF-8
console-setup console-setup/codeset47 select Guess optimal character set

# Time zone
tzdata tzdata/Areas select Europe
tzdata tzdata/Zones/Europe select Moscow

# Do not prompt about restarting services during build
grub-efi-amd64 grub-efi-amd64/no_esp_warning boolean true
