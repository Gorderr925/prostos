<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120d"/>
      <stop offset="0.55" stop-color="#071a14"/>
      <stop offset="1" stop-color="#0b2419"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#16a34a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#04120d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- тонкая сетка -->
  <g stroke="#22c55e" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 180H1920M0 360H1920M0 540H1920M0 720H1920M0 900H1920"/>
    <path d="M320 0V1080M640 0V1080M960 0V1080M1280 0V1080M1600 0V1080"/>
  </g>

  <!-- концентрические окружности справа -->
  <g fill="none" stroke="#4ade80" stroke-opacity="0.10">
    <circle cx="1560" cy="250" r="140" stroke-width="1.5"/>
    <circle cx="1560" cy="250" r="230" stroke-width="1.2"/>
    <circle cx="1560" cy="250" r="330" stroke-width="1"/>
    <circle cx="1560" cy="250" r="450" stroke-width="0.8"/>
  </g>

  <!-- логотип -->
  <g transform="translate(960 430)">
    <rect x="-58" y="-58" width="116" height="116" rx="30" fill="#04120d" stroke="url(#mark)" stroke-width="3"/>
    <path d="M-18 -34h30c17 0 28 10 28 25s-11 25-28 25h-12v24h-18z" fill="url(#mark)"/>
    <circle cx="26" cy="34" r="5" fill="#4ade80"/>
  </g>

  <text x="960" y="560" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif"
        font-size="76" font-weight="700" fill="#ecfdf5" letter-spacing="1">ProstOS</text>
  <text x="960" y="610" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif"
        font-size="26" font-weight="400" fill="#6ee7b7" letter-spacing="6">ПРОСТО. ОТКРЫТО. ТВОЁ.</text>

  <g opacity="0.55">
    <text x="1840" y="1020" text-anchor="end" font-family="Inter, Noto Sans, sans-serif"
          font-size="18" fill="#9fb8ac">Debian 13 · XFCE · твой компьютер — твои правила</text>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
