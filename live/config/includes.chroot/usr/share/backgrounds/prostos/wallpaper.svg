<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#03140d"/>
      <stop offset="45%" stop-color="#0a3020"/>
      <stop offset="100%" stop-color="#041a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M0 0 H56" stroke="#34d399" stroke-opacity="0.07" stroke-width="1"/>
      <path d="M0 0 V56" stroke="#34d399" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.6" fill="#4ade80" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- emblem -->
  <g transform="translate(1430 405)">
    <circle r="300" fill="#02120b" fill-opacity="0.45"/>
    <circle r="252" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.85"/>
    <circle r="286" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.28"/>
    <circle r="300" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.16"/>
    <path d="M -300 0 A 300 300 0 0 1 120 -275" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-opacity="0.9" stroke-linecap="round"/>
    <path d="M 300 0 A 300 300 0 0 1 -60 294" fill="none" stroke="#15803d" stroke-width="5" stroke-opacity="0.85" stroke-linecap="round"/>
    <text x="0" y="118" text-anchor="middle" font-family="DejaVu Sans, Noto Sans, sans-serif"
          font-size="360" font-weight="bold" fill="url(#letter)">P</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(150 760)">
    <rect x="0" y="-74" width="118" height="8" fill="url(#line)"/>
    <text x="0" y="0" font-family="DejaVu Sans, Noto Sans, sans-serif"
          font-size="124" font-weight="bold" fill="#eafff2" letter-spacing="-2">ProstOS</text>
    <text x="4" y="58" font-family="DejaVu Sans, Noto Sans, sans-serif"
          font-size="34" fill="#6ee7b7" letter-spacing="1">Просто. Открыто. Твоё.</text>
    <text x="4" y="112" font-family="DejaVu Sans, Noto Sans, sans-serif"
          font-size="24" fill="#4f8a68" letter-spacing="1.5">DEBIAN 13 · XFCE · OPEN SOURCE</text>
  </g>

  <!-- corner accent -->
  <g opacity="0.9">
    <rect x="1720" y="930" width="160" height="3" fill="url(#ring)"/>
    <rect x="1780" y="948" width="100" height="3" fill="#15803d"/>
  </g>
</svg>
